<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>یک دریای دور</title>
  <meta name="description" content="یک دریای دور؛ دو کتاب، دو مسیر، یک دریا.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <section class="hero">
      <div class="stars"></div>
      <div class="hero-copy">
        <p class="eyebrow">دو کتاب · یک جهان</p>
        <h1>یک دریای دور</h1>
        <p class="subtitle">رؤیاهایی که باید بیایند...</p>
      </div>
    </section>

    <section class="books" aria-label="دو جلد کتاب">
      <article class="book-card">
        <img src="cover1.jpg" alt="جلد کتاب نخست یک دریای دور؛ تا رسیدن به دریا" loading="eager">
        <div class="book-info">
          <span>کتاب نخست</span>
          <h2>تا رسیدن به دریا</h2>
        </div>
      </article>
      <article class="book-card">
        <img src="cover2.jpg" alt="جلد کتاب دوم یک دریای دور؛ آن سوی افق" loading="eager">
        <div class="book-info">
          <span>کتاب دوم</span>
          <h2>آن سوی افق</h2>
        </div>
      </article>
    </section>

    <section class="closing">
      <p>گاهی یک رؤیا، فقط یک رؤیا نیست؛</p>
      <p>مسیر رسیدن است.</p>
    </section>
  </main>
</body>
</html>
